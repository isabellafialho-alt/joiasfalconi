<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FALCONI Semijoias</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3E4D0;--rose:#805251;--wine:#781D35;--gold:#C9A063;--cream:#FAF6EF;--ink:#40262B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg) radial-gradient(circle at 50% 0,var(--cream),var(--bg) 60%);color:var(--ink);font:300 16px/1.6 'Jost',system-ui,sans-serif}
h1,h2,h3,.brand{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;margin:0}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 4vw;background:var(--wine);color:var(--cream);border-bottom:1px solid var(--gold)}
.brand{font-size:27px;letter-spacing:.14em;color:var(--cream);text-decoration:none}
header input{flex:1;min-width:0;max-width:340px;margin-left:auto;padding:8px 16px;border-radius:30px;border:1px solid var(--gold);background:var(--cream)}
.hb{background:none;border:1px solid var(--gold);color:var(--cream);padding:7px 13px;border-radius:30px;cursor:pointer;white-space:nowrap}
.hb:hover{background:var(--gold);color:var(--ink)}
:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.hero{text-align:center;padding:48px 5vw 30px}
.hero svg{width:80px;color:var(--gold)}
.hero h1{font-size:clamp(40px,10vw,84px);letter-spacing:.1em;color:var(--wine);line-height:1.05;margin:6px 0}
.slogan{font:italic 500 26px 'Cormorant Garamond',serif;color:var(--rose);margin:0 0 10px}
.hero h2{font-size:clamp(22px,4vw,30px);color:var(--ink)}
.hero p{max-width:50ch;margin:8px auto 20px;color:var(--rose)}
.btn{display:inline-block;background:var(--wine);color:var(--cream);border:0;border-radius:30px;padding:11px 24px;font-weight:500;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--ink)}.btn.o{background:none;color:var(--wine);border:1px solid var(--wine)}.btn.o:hover{background:var(--wine);color:var(--cream)}
.btn.s{padding:6px 14px;font-size:14px}
nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:12px 4vw}
nav button,.tabs button{background:none;border:1px solid var(--gold);color:var(--wine);padding:7px 18px;border-radius:30px;cursor:pointer}
nav button[aria-pressed=true],.tabs button[aria-pressed=true]{background:var(--wine);border-color:var(--wine);color:var(--cream)}
main{max-width:1100px;margin:0 auto;padding:10px 4vw 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px}
.card{background:var(--cream);border:1px solid var(--gold);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.imgw{position:relative}.imgw img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;cursor:pointer;background:#e8d6c0}
.tag{position:absolute;left:10px;top:10px;background:var(--wine);color:var(--cream);font-size:12px;padding:2px 12px;border-radius:20px}
.fav{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--gold);background:rgba(250,246,239,.92);color:var(--wine);font-size:20px;cursor:pointer}
.info{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}.info h3{font-size:24px}.info small{color:var(--rose)}.info .btn{margin-top:auto}
.price{font:500 25px 'Cormorant Garamond',serif;color:var(--wine)}.price s{font-size:17px;color:var(--rose);margin-right:6px}
.empty{text-align:center;color:var(--rose);padding:40px 0;grid-column:1/-1}
footer{text-align:center;padding:26px 5vw 40px;border-top:1px solid var(--gold);color:var(--rose);font-size:14px}
footer a{color:var(--wine)}footer details{max-width:600px;margin:10px auto;text-align:left}
.ov{position:fixed;inset:0;z-index:40;background:rgba(40,20,25,.6);display:none;overflow:auto;padding:4vw}.ov.on{display:block}
.box{background:var(--cream);max-width:760px;margin:0 auto;border-radius:14px;border:1px solid var(--gold);padding:20px;position:relative}
.x{position:absolute;right:12px;top:6px;background:none;border:0;font-size:30px;cursor:pointer;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:640px){.two{grid-template-columns:1fr}}
.big{width:100%;border-radius:10px;cursor:zoom-in}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label{display:block;font-size:14px;margin-top:8px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--gold);border-radius:8px;background:#fff}
input[type=checkbox]{width:auto}
.spec{font-size:14px;margin:0;padding:0;list-style:none;color:var(--rose)}
.rel img{width:70px;height:88px;object-fit:cover;border-radius:8px;cursor:pointer}
aside{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:var(--cream);z-index:35;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column;border-left:1px solid var(--gold);padding-top:env(safe-area-inset-top,0px)}
aside.on{transform:none}.ah{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--gold)}.ah h2{font-size:26px}
.ab{flex:1;overflow:auto;padding:8px 18px}
.it{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--gold)}.it img{width:56px;height:70px;object-fit:cover;border-radius:6px}.it div{flex:1}.it small{color:var(--rose);display:block}
.q button{width:26px;height:26px;border-radius:50%;border:1px solid var(--rose);background:none;cursor:pointer}
.tot{display:flex;justify-content:space-between;margin:8px 0}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;width:54px;height:54px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.lb{position:fixed;inset:0;z-index:60;background:rgba(40,20,25,.9);display:none;place-items:center;padding:16px;cursor:zoom-out}.lb.on{display:grid}.lb img{max-width:100%;max-height:100%;border-radius:8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.bar{background:var(--cream);border:1px solid var(--gold);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}.kp div{background:var(--cream);border:1px solid var(--gold);border-radius:12px;padding:14px}.kp b{display:block;font:500 34px 'Cormorant Garamond',serif;color:var(--wine)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;background:var(--cream)}th,td{padding:8px;border-bottom:1px solid var(--gold);text-align:left;vertical-align:middle}td img{width:44px;height:55px;object-fit:cover;border-radius:6px}
.err{color:var(--wine);font-size:14px;min-height:20px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

let bag=ls("fal_bag")||[],favs=ls("fal_fav")||[],cat="Todos",q="",favMode=false,coupon=null,owner=false,dirty=false,tab="Painel",art=null,editing=null,pimg=null,adminView=false,logged=(()=>{try{return sessionStorage.getItem("fal_adm")==="1"}catch(e){return false}})();
const S=()=>D.settings,byId=id=>D.products.find(p=>p.id===id);
const pr=p=>{const a=+p.price||0,b=+p.promo||0;return b>0&&(!a||b<a)?b:(a||null)};
const vars=p=>Object.keys(p.sizes||{});
const st=(p,k)=>{const v=vars(p).length?p.sizes[k]:p.stock;return v===""||v==null?null:+v};
const out=p=>vars(p).length?vars(p).every(k=>st(p,k)===0):st(p)===0;
const total=p=>vars(p).length?vars(p).reduce((a,k)=>a+(st(p,k)||0),0):(st(p)||0);
const save=()=>{ls("fal_bag",bag);ls("fal_fav",favs)};
bag=bag.filter(i=>byId(i.id));
const priceH=p=>{const c=pr(p);return c?`<div class="price">${+p.price>c?`<s>${money(p.price)}</s>`:""}${money(c)}</div>`:`<div class="price" style="font-size:19px">Valor sob consulta</div>`};
const buildHTML=()=>RAW.replace(/(<script type="application\/json" id="data">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+JSON.stringify(D).replace(/</g,"\\u003c")+b);

function render(){
 const adm=adminView;
 $("#shop").hidden=adm;$("#admin").hidden=!adm;
 $("#cnt").textContent=bag.reduce((a,i)=>a+i.qty,0);$("#fv").textContent=favs.length;
 $("#wa").href="https://wa.me/"+S().whats;
 adm?renderAdmin():renderShop();
}
function renderShop(){
 const s=S();$("#slg").textContent=s.slogan;$("#bt").textContent=s.bt;$("#btx").textContent=s.btx;
 const cats=["Todos",...D.cats,"Lançamentos","Promoções"];
 $("#cats").innerHTML='<span id="loja"></span>'+cats.map(c=>`<button data-a="cat" data-v="${esc(c)}" aria-pressed="${c===cat&&!favMode}">${esc(c)}</button>`).join("");
 const l=D.products.filter(p=>!p.hidden&&(cat==="Todos"||(cat==="Lançamentos"?p.launch:cat==="Promoções"?p.sale:p.cat===cat))&&(!favMode||favs.includes(p.id))&&(p.name+" "+p.code+" "+p.desc).toLowerCase().includes(q)).sort((a,b)=>!!b.featured-!!a.featured);
 $("#grid").innerHTML=l.length?l.map(p=>`<article class="card"><div class="imgw"><img src="${esc(p.img)}" alt="${esc(p.name)}" data-a="open" data-v="${p.id}" loading="lazy">${out(p)?'<span class="tag">Esgotado</span>':p.launch?'<span class="tag">Lançamento</span>':p.sale?'<span class="tag">Promoção</span>':""}<button class="fav" data-a="fav" data-v="${p.id}" aria-label="Favoritar">${favs.includes(p.id)?"♥":"♡"}</button></div><div class="info"><h3>${esc(p.name)}</h3><small>${esc(p.code)}</small>${priceH(p)}<button class="btn" data-a="open" data-v="${p.id}">Ver detalhes</button></div></article>`).join(""):'<p class="empty">Nenhuma peça encontrada.</p>';
 const pol=[["Trocas e devoluções",s.troca],["Garantia",s.garantia],["Cuidados com as semijoias",s.cuidados]].filter(x=>x[1]).map(x=>`<details><summary>${x[0]}</summary><p>${esc(x[1])}</p></details>`).join("");
 $("#foot").innerHTML=`<div class="slogan">${esc(s.slogan)}</div>${pol}<p>${s.insta&&/^https:\/\//.test(s.insta)?`<a href="${esc(s.insta)}" target="_blank" rel="noopener">Instagram</a> · `:""}<a href="https://wa.me/${esc(s.whats)}" target="_blank" rel="noopener">WhatsApp</a> · <a href="#" data-a="admin">Área administrativa</a></p><p>© FALCONI Semijoias · Todos os direitos reservados</p>`;
}
function renderBag(){
 let sub=0;
 $("#bi").innerHTML=bag.length?bag.map((i,n)=>{const p=byId(i.id),c=pr(p);if(c)sub+=c*i.qty;return `<div class="it"><img src="${esc(p.img)}" alt=""><div><b>${esc(p.name)}</b><small>${esc(p.code)}${i.size?" · "+esc(i.size):""}</small><div class="q"><button data-a="qm" data-v="${n}" aria-label="Diminuir">−</button> ${i.qty} <button data-a="qp" data-v="${n}" aria-label="Aumentar">+</button></div></div><div>${c?money(c*i.qty):"sob consulta"}</div></div>`}).join(""):'<p class="empty">Sua sacola está vazia.</p>';
 const d=discount(sub);
 $("#bt2").innerHTML=`<div class="tot"><span>Subtotal</span><span>${money(sub)}</span></div>${d?`<div class="tot"><span>Desconto (${esc(coupon.code)})</span><span>− ${money(d)}</span></div>`:""}<div class="tot"><b>Total</b><b>${money(sub-d)}</b></div>`;
 return {sub,d};
}
function discount(sub){const c=coupon;if(!c)return 0;const t=new Date().toISOString().slice(0,10);if(!c.active||(c.end&&t>c.end)||sub<(+c.min||0))return 0;return Math.min(+c.value||0,sub)}
function maxQ(p,size){const s=st(p,size);return s==null?99:s}
const act={
 cat(v){cat=v;favMode=false;render()},
 favs(){favMode=!favMode;adminView=false;render();document.getElementById("loja").scrollIntoView()},
 fav(v){favs=favs.includes(v)?favs.filter(x=>x!==v):[...favs,v];save();render();if($("#ov").classList.contains("on"))act.open(v)},
 close(){$("#ov").classList.remove("on")},
 zoom(v,t){$("#lb").innerHTML=`<img src="${esc(t.src)}" alt="">`;$("#lb").classList.add("on")},
 unzoom(){$("#lb").classList.remove("on")},
 open(id){
  const p=byId(id),v=vars(p),rel=D.products.filter(x=>x.cat===p.cat&&x.id!==id&&!x.hidden).slice(0,4);
  const sp=[["Material","material"],["Banho","bath"],["Cor","color"],["Pedra","stone"],["Dimensões","dim"],["Garantia","warranty"],["Conservação","care"]].filter(x=>p[x[1]]).map(x=>`<li>${x[0]}: ${esc(p[x[1]])}</li>`).join("");
  $("#mb").innerHTML=`<div class="two"><img class="big" src="${esc(p.img)}" alt="${esc(p.name)}" data-a="zoom"><div><h2>${esc(p.name)}</h2><small>${esc(p.code)} · ${esc(p.cat)}</small><p>${esc(p.desc)}</p><ul class="spec">${sp}</ul>${priceH(p)}
  ${out(p)?'<p class="err">Peça esgotada no momento.</p>':`${v.length?`<label>Tamanho / variação<select id="msz">${v.map(k=>`<option value="${esc(k)}" ${st(p,k)===0?"disabled":""}>${esc(k)}${st(p,k)===0?" (esgotado)":""}</option>`).join("")}</select></label>`:""}<label>Quantidade<input id="mq" type="number" min="1" value="1"></label><div class="err" id="me"></div><div class="row"><button class="btn" data-a="add" data-v="${id}">Adicionar à sacola</button>`}
  <button class="btn o" data-a="fav" data-v="${id}">${favs.includes(id)?"♥ Favorita":"♡ Favoritar"}</button><button class="btn o" data-a="share" data-v="${id}">Compartilhar</button></div>${out(p)?"":"</div>"}</div>
  ${rel.length?`<h3 style="margin-top:18px">Você também pode gostar</h3><div class="row rel">${rel.map(x=>`<img src="${esc(x.img)}" alt="${esc(x.name)}" data-a="open" data-v="${x.id}">`).join("")}</div>`:""}`;
  $("#ov").classList.add("on");
 },
 add(id){
  const p=byId(id),size=$("#msz")?$("#msz").value:"",n=Math.max(1,parseInt($("#mq").value)||1);
  const f=bag.find(i=>i.id===id&&i.size===size),have=f?f.qty:0;
  if(have+n>maxQ(p,size)){$("#me").textContent="Quantidade acima do estoque disponível.";return}
  f?f.qty+=n:bag.push({id,size,qty:n});save();render();act.close();act.bag(true)
 },
 share(id){const p=byId(id),u=location.href.split("#")[0];if(navigator.share)navigator.share({title:p.name,url:u}).catch(()=>{});else window.open("https://wa.me/?text="+encodeURIComponent(p.name+" – FALCONI "+u),"_blank")},
 bag(open){const a=$("#bag");const on=open===true?true:!a.classList.contains("on");a.classList.toggle("on",on);if(on)renderBag()},
 qm(n){if(--bag[n].qty<=0)bag.splice(n,1);save();render();renderBag()},
 qp(n){const i=bag[n];if(i.qty+1<=maxQ(byId(i.id),i.size))i.qty++;save();render();renderBag()},
 coupon(){const c=D.coupons.find(x=>x.code.toLowerCase()===$("#cp").value.trim().toLowerCase());const r=renderBag();coupon=c||null;const d=discount(r.sub);$("#cpm").textContent=!c?"Cupom inválido.":d?"Cupom aplicado.":"Cupom expirado, inativo ou abaixo do valor mínimo.";if(!d)coupon=null;renderBag()},
 send(){
  const nm=$("#cn").value.trim(),tl=$("#ct").value.trim();
  if(!bag.length){$("#cerr").textContent="Sua sacola está vazia.";return}
  if(!nm||!tl){$("#cerr").textContent="Informe seu nome e telefone.";return}
  $("#cerr").textContent="";const r=renderBag();
  const no="FAL-"+new Date().toISOString().slice(2,10).replace(/-/g,"")+"-"+Math.floor(1000+Math.random()*9000);
  const L=bag.map(i=>{const p=byId(i.id),c=pr(p);return `• Código: ${p.code}\n  Produto: ${p.name}\n  Quantidade: ${i.qty}${i.size?"\n  Tamanho: "+i.size:""}\n  Valor unitário: ${c?money(c):"sob consulta"}\n  Subtotal: ${c?money(c*i.qty):"sob consulta"}`}).join("\n\n");
  const m=`Olá, FALCONI! Gostaria de realizar um pedido.\n\nPedido nº: ${no}\nCliente: ${nm}\nTelefone: ${tl}\n\nProdutos selecionados:\n${L}\n\n${r.d?"Desconto (cupom "+coupon.code+"): "+money(r.d)+"\n":""}Total dos produtos com preço cadastrado: ${money(r.sub-r.d)}\nRecebimento: ${$("#cm").value}${$("#ca").value.trim()?" – "+$("#ca").value.trim():""}\nPagamento pretendido: ${$("#cy").value}\nObservações: ${$("#co").value.trim()||"-"}\n\nAguardo a confirmação da disponibilidade e do pagamento. Obrigada!`;
  window.open("https://wa.me/"+S().whats+"?text="+encodeURIComponent(m),"_blank");
 },
 admin(){adminView=true;window.scrollTo(0,0);render()},
 home(){adminView=false;window.scrollTo(0,0);render()},
 login(){const u=$("#lu").value.trim(),p=$("#lp").value;if(u===(S().user||"adm")&&p===(S().pass||"12345")){logged=true;try{sessionStorage.setItem("fal_adm","1")}catch(e){}render()}else $("#le").textContent="Usuário ou senha incorretos."},
 logout(){logged=false;try{sessionStorage.removeItem("fal_adm")}catch(e){}render()},
 tab(v){tab=v;render()},
 async pub(){const e=$("#pm");if(!art){e.textContent="Publicação indisponível para este acesso.";return}e.textContent="Publicando…";try{await art.publish(buildHTML())}catch(x){e.textContent="Não foi possível publicar: "+(x&&(x.code||x.message)||x)}},
 edit(id){
  editing=id?byId(id):{id:"",cat:D.cats[0],sizes:{}};pimg=null;const p=editing;
  const i=(k,l,t)=>`<label>${l}<input id="f_${k}" type="${t||"text"}" step="0.01" value="${esc(p[k])}"></label>`;
  const ck=(k,l)=>`<label><input type="checkbox" id="f_${k}" ${p[k]?"checked":""}> ${l}</label>`;
  $("#mb").innerHTML=`<h2>${id?"Editar":"Cadastrar nova"} peça</h2><div class="two"><div>${i("code","Código")}${i("name","Nome")}<label>Categoria<select id="f_cat">${D.cats.map(c=>`<option ${c===p.cat?"selected":""}>${esc(c)}</option>`).join("")}</select></label><label>Descrição<textarea id="f_desc" rows="3">${esc(p.desc)}</textarea></label>${i("price","Preço de venda (R$)","number")}${i("promo","Preço promocional (R$)","number")}${i("stock","Estoque (vazio = sem controle)","number")}<label>Tamanhos/variações e estoque (ex.: Aro 16:3, Aro 18:2, Aro 20)<input id="f_sizes" value="${esc(fmt(p.sizes))}"></label></div><div>${i("material","Material")}${i("bath","Banho")}${i("color","Cor")}${i("stone","Pedra")}${i("dim","Dimensões")}${i("warranty","Garantia")}${i("care","Conservação")}<label>Fotografia<input id="f_img" type="file" accept="image/*"></label><img id="pv" src="${esc(p.img)}" alt="" style="width:90px;margin-top:6px;border-radius:8px">${ck("featured","Destaque na página inicial")}${ck("launch","Lançamento")}${ck("sale","Promoção")}${ck("hidden","Ocultar do catálogo")}</div></div><div class="err" id="fe"></div><button class="btn" data-a="saveP">Salvar</button>`;
  $("#f_img").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);pimg=c.toDataURL("image/jpeg",.82);$("#pv").src=pimg};im.src=r.result};r.readAsDataURL(f)};
  $("#ov").classList.add("on");
 },
 saveP(){
  const g=k=>$("#f_"+k).value.trim(),c=k=>$("#f_"+k).checked,p=editing;
  if(!g("name")||!g("code")){$("#fe").textContent="Informe o código e o nome.";return}
  if(D.products.some(x=>x.code===g("code")&&x!==p)){$("#fe").textContent="Já existe uma peça com este código.";return}
  const n=k=>g(k)===""?"":Math.max(0,+g(k));
  Object.assign(p,{code:g("code"),name:g("name"),cat:g("cat"),desc:g("desc"),price:n("price"),promo:n("promo"),stock:n("stock"),sizes:parse(g("sizes")),material:g("material"),bath:g("bath"),color:g("color"),stone:g("stone"),dim:g("dim"),warranty:g("warranty"),care:g("care"),featured:c("featured"),launch:c("launch"),sale:c("sale"),hidden:c("hidden"),img:pimg||p.img||""});
  if(!p.id){p.id="p"+Date.now();D.products.push(p)}
  dirty=true;act.close();render();
 },
 dup(id){const p=JSON.parse(JSON.stringify(byId(id)));p.id="p"+Date.now();p.code+="-2";p.name+=" (cópia)";p.hidden=true;D.products.push(p);dirty=true;render()},
 hide(id){const p=byId(id);p.hidden=!p.hidden;dirty=true;render()},
 del(id,t){if(t.dataset.c!=="1"){t.dataset.c="1";t.textContent="Confirmar?";return}D.products=D.products.filter(p=>p.id!==id);dirty=true;render()},
 addC(){const g=k=>$("#c_"+k).value.trim();if(!g("code")||!(+g("value")>0)){$("#pm").textContent="Informe o código e o valor do cupom.";return}D.coupons.push({code:g("code"),value:+g("value"),min:+g("min")||0,end:g("end"),active:true});dirty=true;render()},
 togC(n){D.coupons[n].active=!D.coupons[n].active;dirty=true;render()},
 delC(n){D.coupons.splice(n,1);dirty=true;render()},
 saveL(){const g=k=>$("#l_"+k).value.trim();const s=S();["whats","insta","user","pass","slogan","bt","btx","troca","garantia","cuidados"].forEach(k=>s[k]=g(k));s.whats=s.whats.replace(/\D/g,"");const c=g("cats").split(",").map(x=>x.trim()).filter(Boolean);if(c.length)D.cats=c;dirty=true;render()}
};
const parse=t=>{const o={};t.split(",").map(s=>s.trim()).filter(Boolean).forEach(s=>{const i=s.lastIndexOf(":");const k=i<0?s:s.slice(0,i).trim(),v=i<0?"":s.slice(i+1).trim();o[k]=v===""||isNaN(v)?"":Math.max(0,+v)});return o};
const fmt=o=>Object.entries(o||{}).map(([k,v])=>v===""||v==null?k:k+":"+v).join(", ");

function renderAdmin(){
 const A=$("#adm");
 if(!logged){A.innerHTML='<div class="box" style="margin-top:40px;max-width:360px;text-align:center"><h2>FALCONI</h2><p>Área administrativa</p><label>Usuário<input id="lu" autocomplete="username"></label><label>Senha<input id="lp" type="password" autocomplete="current-password"></label><div class="err" id="le"></div><p><button class="btn" data-a="login">Entrar</button> <button class="btn o" data-a="home">Voltar</button></p></div>';return}
 if(!owner){A.innerHTML='<div class="empty" style="padding:60px 0"><h2>Acesso confirmado</h2><p>Somente a proprietária, usando a conta que criou o site, consegue publicar alterações no catálogo.</p><button class="btn" data-a="logout">Sair</button></div>';return}
 const P=D.products,tabs=["Painel","Produtos","Promoções","Loja"];
 let h=`<div class="bar"><div><b>Painel administrativo FALCONI</b><br><small>${dirty?"Há alterações ainda não publicadas.":"Tudo publicado."}</small></div><div class="row"><button class="btn o s" data-a="home">Ver loja</button><button class="btn o s" data-a="logout">Sair</button><button class="btn s" data-a="pub">Publicar alterações</button></div></div><div class="err" id="pm"></div><div class="tabs">${tabs.map(t=>`<button data-a="tab" data-v="${t}" aria-pressed="${t===tab}">${t}</button>`).join("")}</div>`;
 if(tab==="Painel"){const es=P.filter(out).length,low=P.filter(p=>!out(p)&&(st(p)!=null||vars(p).some(k=>st(p,k)!=null))&&total(p)<=2).length;
  h+=`<div class="kp"><div><b>${P.length}</b>Modelos cadastrados</div><div><b>${P.reduce((a,p)=>a+total(p),0)}</b>Peças em estoque controlado</div><div><b>${P.length-es}</b>Disponíveis</div><div><b>${es}</b>Esgotados</div><div><b>${low}</b>Estoque baixo (2 ou menos)</div><div><b>${P.filter(p=>p.hidden).length}</b>Ocultos</div><div><b>${D.coupons.filter(c=>c.active).length}</b>Cupons ativos</div></div><p><button class="btn" data-a="edit" data-v="">Cadastrar nova peça</button></p>`}
 if(tab==="Produtos")h+=`<p><button class="btn" data-a="edit" data-v="">Cadastrar nova peça</button></p><div class="tw"><table><tr><th></th><th>Código</th><th>Nome</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th>Situação</th><th>Ações</th></tr>${P.map(p=>`<tr><td><img src="${esc(p.img)}" alt=""></td><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.cat)}</td><td>${pr(p)?money(pr(p)):"—"}</td><td>${vars(p).length?fmt(p.sizes):(st(p)==null?"sem controle":st(p))}</td><td>${p.hidden?"Oculta":out(p)?"Esgotada":"Publicada"}</td><td class="row"><button class="btn s o" data-a="edit" data-v="${p.id}">Editar</button><button class="btn s o" data-a="dup" data-v="${p.id}">Duplicar</button><button class="btn s o" data-a="hide" data-v="${p.id}">${p.hidden?"Publicar":"Ocultar"}</button><button class="btn s o" data-a="del" data-v="${p.id}">Excluir</button></td></tr>`).join("")}</table></div>`;
 if(tab==="Promoções")h+=`<div class="two"><div><h3>Novo cupom (valor fixo em reais)</h3><label>Código<input id="c_code"></label><label>Desconto (R$)<input id="c_value" type="number" step="0.01"></label><label>Compra mínima (R$)<input id="c_min" type="number" step="0.01"></label><label>Válido até<input id="c_end" type="date"></label><p><button class="btn" data-a="addC">Adicionar cupom</button></p></div><div><h3>Cupons</h3>${D.coupons.map((c,n)=>`<div class="bar" style="margin-bottom:8px"><span><b>${esc(c.code)}</b> · ${money(c.value)}${c.min?" · mín. "+money(c.min):""}${c.end?" · até "+esc(c.end):""}</span><span class="row"><button class="btn s o" data-a="togC" data-v="${n}">${c.active?"Desativar":"Ativar"}</button><button class="btn s o" data-a="delC" data-v="${n}">Remover</button></span></div>`).join("")||"<p>Nenhum cupom cadastrado.</p>"}<p><small>Para preço promocional de uma peça, edite o produto e marque Promoção.</small></p></div></div>`;
 if(tab==="Loja"){const s=S(),i=(k,l)=>`<label>${l}<input id="l_${k}" value="${esc(s[k])}"></label>`,t=(k,l)=>`<label>${l}<textarea id="l_${k}" rows="2">${esc(s[k])}</textarea></label>`;
  h+=`<div class="two"><div>${i("whats","WhatsApp (com 55 e DDD)")}${i("insta","Link do Instagram (https://…)")}${i("user","Usuário do painel (vazio = adm)")}${i("pass","Senha do painel (vazio = 12345)")}${i("slogan","Slogan")}${i("bt","Título do banner")}${t("btx","Texto do banner")}<label>Categorias (separadas por vírgula)<input id="l_cats" value="${esc(D.cats.join(", "))}"></label></div><div>${t("troca","Política de trocas e devoluções")}${t("garantia","Garantia")}${t("cuidados","Cuidados com as semijoias")}<p><button class="btn" data-a="saveL">Aplicar alterações</button></p></div></div>`}
 A.innerHTML=h;
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const f=act[t.dataset.a];if(f){if(t.tagName==="A")e.preventDefault();f(t.dataset.v,t,e)}});
$("#q").oninput=e=>{q=e.target.value.toLowerCase().trim();adminView=false;render()};
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="lp")act.login();if(e.key==="Escape"){act.close();act.unzoom();$("#bag").classList.remove("on")}});
window.onhashchange=render;
render();
(async()=>{try{const u=await claude.use("user");owner=!!u&&((await u.isOwner())||(await u.canEdit()));art=await claude.use("artifact")}catch(e){}render()})();
