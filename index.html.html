<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joias Falconi</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3E4D0;--rose:#805251;--wine:#781D35;--gold:#C9A063;--cream:#FAF6EF;--ink:#40262B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg) radial-gradient(circle at 50% 0,var(--cream),var(--bg) 60%);color:var(--ink);font:300 16px/1.6 'Jost',system-ui,sans-serif}
h1,h2,h3,.brand{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;margin:0}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 4vw;background:var(--wine);color:var(--cream);border-bottom:1px solid var(--gold)}
.brand{font-size:27px;letter-spacing:.14em;color:var(--cream);text-decoration:none}
header input{flex:1;min-width:0;max-width:340px;margin-left:auto;padding:8px 16px;border-radius:30px;border:1px solid var(--gold);background:var(--cream)}
.hb{background:none;border:1px solid var(--gold);color:var(--cream);padding:7px 13px;border-radius:30px;cursor:pointer;white-space:nowrap}
.hb:hover{background:var(--gold);color:var(--ink)}
:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.hero{text-align:center;padding:48px 5vw 30px}
.hero svg{width:80px;color:var(--gold)}
.hero h1{font-size:clamp(40px,10vw,84px);letter-spacing:.1em;color:var(--wine);line-height:1.05;margin:6px 0}
.slogan{font:italic 500 26px 'Cormorant Garamond',serif;color:var(--rose);margin:0 0 10px}
.hero h2{font-size:clamp(22px,4vw,30px);color:var(--ink)}
.hero p{max-width:50ch;margin:8px auto 20px;color:var(--rose)}
.btn{display:inline-block;background:var(--wine);color:var(--cream);border:0;border-radius:30px;padding:11px 24px;font-weight:500;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--ink)}.btn.o{background:none;color:var(--wine);border:1px solid var(--wine)}.btn.o:hover{background:var(--wine);color:var(--cream)}
.btn.s{padding:6px 14px;font-size:14px}
nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:12px 4vw}
nav button,.tabs button{background:none;border:1px solid var(--gold);color:var(--wine);padding:7px 18px;border-radius:30px;cursor:pointer}
nav button[aria-pressed=true],.tabs button[aria-pressed=true]{background:var(--wine);border-color:var(--wine);color:var(--cream)}
main{max-width:1100px;margin:0 auto;padding:10px 4vw 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px}
.card{background:var(--cream);border:1px solid var(--gold);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.imgw{position:relative}.imgw img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;cursor:pointer;background:#e8d6c0}
.tag{position:absolute;left:10px;top:10px;background:var(--wine);color:var(--cream);font-size:12px;padding:2px 12px;border-radius:20px}
.fav{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--gold);background:rgba(250,246,239,.92);color:var(--wine);font-size:20px;cursor:pointer}
.info{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}.info h3{font-size:24px}.info small{color:var(--rose)}.info .btn{margin-top:auto}
.price{font:500 25px 'Cormorant Garamond',serif;color:var(--wine)}.price s{font-size:17px;color:var(--rose);margin-right:6px}
.empty{text-align:center;color:var(--rose);padding:40px 0;grid-column:1/-1}
footer{text-align:center;padding:26px 5vw 40px;border-top:1px solid var(--gold);color:var(--rose);font-size:14px}
footer a{color:var(--wine)}footer details{max-width:600px;margin:10px auto;text-align:left}
.ov{position:fixed;inset:0;z-index:40;background:rgba(40,20,25,.6);display:none;overflow:auto;padding:4vw}.ov.on{display:block}
.box{background:var(--cream);max-width:760px;margin:0 auto;border-radius:14px;border:1px solid var(--gold);padding:20px;position:relative}
.x{position:absolute;right:12px;top:6px;background:none;border:0;font-size:30px;cursor:pointer;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:640px){.two{grid-template-columns:1fr}}
.big{width:100%;border-radius:10px;cursor:zoom-in}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label{display:block;font-size:14px;margin-top:8px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--gold);border-radius:8px;background:#fff}
input[type=checkbox]{width:auto}
.spec{font-size:14px;margin:0;padding:0;list-style:none;color:var(--rose)}
.rel img{width:70px;height:88px;object-fit:cover;border-radius:8px;cursor:pointer}
aside{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:var(--cream);z-index:35;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column;border-left:1px solid var(--gold);padding-top:env(safe-area-inset-top,0px)}
aside.on{transform:none}.ah{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--gold)}.ah h2{font-size:26px}
.ab{flex:1;overflow:auto;padding:8px 18px}
.it{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--gold)}.it img{width:56px;height:70px;object-fit:cover;border-radius:6px}.it div{flex:1}.it small{color:var(--rose);display:block}
.q button{width:26px;height:26px;border-radius:50%;border:1px solid var(--rose);background:none;cursor:pointer}
.tot{display:flex;justify-content:space-between;margin:8px 0}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;width:54px;height:54px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.lb{position:fixed;inset:0;z-index:60;background:rgba(40,20,25,.9);display:none;place-items:center;padding:16px;cursor:zoom-out}.lb.on{display:grid}.lb img{max-width:100%;max-height:100%;border-radius:8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.bar{background:var(--cream);border:1px solid var(--gold);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}.kp div{background:var(--cream);border:1px solid var(--gold);border-radius:12px;padding:14px}.kp b{display:block;font:500 34px 'Cormorant Garamond',serif;color:var(--wine)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;background:var(--cream)}th,td{padding:8px;border-bottom:1px solid var(--gold);text-align:left;vertical-align:middle}td img{width:44px;height:55px;object-fit:cover;border-radius:6px}
.err{color:var(--wine);font-size:14px;min-height:20px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.card .btn{padding:8px 18px;font-size:14px;width:100%;box-shadow:none}.card .btn[disabled]{opacity:.5;cursor:not-allowed}
.lnk{background:none;border:0;padding:0;color:var(--rose);font-size:13px;text-decoration:underline;text-align:center;cursor:pointer}.lnk:hover{color:var(--wine)}
.card{box-shadow:0 2px 12px rgba(64,38,43,.07)}
.fl{display:flex;justify-content:center;padding:0 4vw 6px}.fl select{width:auto;border-radius:30px;padding:7px 16px}
.sec{font-size:30px;text-align:center;color:var(--wine);margin:18px 0 12px}
.band{max-width:760px;margin:0 auto;padding:30px 5vw;text-align:center;border-top:1px solid var(--gold)}.band h2{font-size:30px;color:var(--wine)}.band p{color:var(--rose)}.band details{text-align:left;margin:8px 0}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--cream);padding:9px 20px;border-radius:30px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:70}#toast.on{opacity:1;transform:translate(-50%,0)}
.big2{font-size:22px;color:var(--wine);border-top:1px solid var(--gold);padding-top:8px}
#ban{width:100%;aspect-ratio:16/6;min-height:190px;max-height:560px;background:linear-gradient(135deg,#781D35,#5a1a2c);display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--gold)}
#ban img{width:100%;height:100%;object-fit:cover;display:block}
#ban .ph{text-align:center;color:var(--cream);padding:0 5vw}#ban .ph b{display:block;font:500 clamp(28px,6vw,64px) 'Cormorant Garamond',serif;letter-spacing:.14em}#ban .ph i{color:var(--gold);font:italic 500 clamp(18px,3vw,28px) 'Cormorant Garamond',serif}
.hero h1{font-size:clamp(30px,8vw,72px)}
@media(max-width:560px){header{flex-wrap:wrap;gap:8px}.brand{font-size:21px;letter-spacing:.08em;white-space:nowrap;margin-right:auto}header input{order:3;max-width:none;flex:1 1 100%;margin:0}}
</style>
</head>

  $("#f_img").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);pimg=c.toDataURL("image/jpeg",.8);$("#pv").src=pimg};im.src=r.result};r.readAsDataURL(f)};
  $("#ov").classList.add("on");
 },
 async saveP(){
  const g=k=>$("#f_"+k).value.trim(),c=k=>$("#f_"+k).checked,n=k=>g(k)===""?null:Math.max(0,+g(k));
  if(!g("name")||!g("code")){$("#pm").textContent="Informe o código e o nome.";return}
  const row={code:g("code"),name:g("name"),cat:g("cat"),descr:g("descr"),price:n("price"),promo:n("promo"),stock:n("stock"),sizes:parse(g("sizes")),material:g("material"),bath:g("bath"),color:g("color"),stone:g("stone"),dim:g("dim"),warranty:g("warranty"),care:g("care"),featured:c("featured"),launch:c("launch"),sale:c("sale"),hidden:c("hidden")};
  if(pimg)row.img=pimg;else if(!editing.id)row.img="";
  if(await db(editing.id?DB.from("products").update(row).eq("id",editing.id):DB.from("products").insert(row))){act.close();toast("Peça salva ✓");await refresh()}
 },
 async seed(){const rows=SEED.map(({id,...r})=>r);if(await db(DB.from("products").insert(rows))){toast("Peças iniciais importadas ✓");await refresh()}},
 async dup(id){const p={...byId(id)};delete p.id;delete p.created_at;p.code+="-2";p.name+=" (cópia)";p.hidden=true;if(await db(DB.from("products").insert(p)))await refresh()},
 async hide(id){if(await db(DB.from("products").update({hidden:!byId(id).hidden}).eq("id",id)))await refresh()},
 async del(id,t){if(t.dataset.c!=="1"){t.dataset.c="1";t.textContent="Confirmar?";return}if(await db(DB.from("products").delete().eq("id",id)))await refresh()},
 async status(id,v){if(await db(DB.rpc("set_order_status",{p_id:id,p_status:v}))){toast("Status atualizado ✓");await refresh()}else await refresh()},
 async addC(){const g=k=>$("#c_"+k).value.trim();if(!g("code")||!(+g("value")>0)){$("#pm").textContent="Informe o código e o valor do cupom.";return}if(await db(DB.from("coupons").insert({code:g("code"),value:+g("value"),min:+g("min")||0,ends:g("end")||null,active:true})))await refresh()},
 async togC(id){const c=CUP.find(x=>x.id===id);if(await db(DB.from("coupons").update({active:!c.active}).eq("id",id)))await refresh()},
 async delC(id){if(await db(DB.from("coupons").delete().eq("id",id)))await refresh()},
 async savePromo(id){const v=$("#pp_"+id).value.trim(),p=byId(id);if(v!==""&&p.price&&+v>=+p.price){$("#pm").textContent="O preço promocional precisa ser menor que o preço de venda.";return}if(await db(DB.from("products").update({promo:v===""?null:Math.max(0,+v),sale:$("#ps_"+id).checked,launch:$("#pl_"+id).checked,featured:$("#pd_"+id).checked}).eq("id",id))){toast("Salvo ✓");await refresh()}},
 async saveCats(c){if(await db(DB.from("settings").upsert({id:1,data:{...S,cats:c}}))){toast("Categorias salvas ✓");await refresh()}},
 async addCat(){const v=$("#nc").value.trim();if(!v)return;if(S.cats.some(x=>x.toLowerCase()===v.toLowerCase())){$("#pm").textContent="Essa categoria já existe.";return}await act.saveCats([...S.cats,v])},
 async renCat(i){const o=S.cats[i],v=$("#rc_"+i).value.trim();if(!v||v===o)return;if(S.cats.some((x,j)=>j!==+i&&x.toLowerCase()===v.toLowerCase())){$("#pm").textContent="Já existe uma categoria com esse nome.";return}if(await db(DB.from("products").update({cat:v}).eq("cat",o))){const c=[...S.cats];c[i]=v;await act.saveCats(c)}},
 async delCat(i,t){const o=S.cats[i];if(P.some(p=>p.cat===o)){$("#pm").textContent="Mova ou exclua as peças desta categoria antes de removê-la.";return}if(t.dataset.c!=="1"){t.dataset.c="1";t.textContent="Confirmar?";return}await act.saveCats(S.cats.filter((_,j)=>j!==+i))},
 async moveCat(v){const [i,d]=v.split(",").map(Number),c=[...S.cats],j=i+d;if(j<0||j>=c.length)return;[c[i],c[j]]=[c[j],c[i]];await act.saveCats(c)},
 async saveL(){const g=k=>$("#l_"+k).value.trim(),d={...S};["name","whats","insta","slogan","bt","btx","about","care","garantia","troca","entrega","fee"].forEach(k=>d[k]=g(k));d.whats=d.whats.replace(/\D/g,"");d.banner=bimg===null?S.banner:bimg;bimg=null;const c=g("cats").split(",").map(x=>x.trim()).filter(Boolean);if(c.length)d.cats=c;if(await db(DB.from("settings").upsert({id:1,data:d}))){toast("Configurações salvas ✓");await refresh()}}
};
function promoTable(){return `<h3>Promoções, novidades e destaques das peças</h3><p><small>Informe o preço promocional (menor que o preço de venda) e marque as opções. Apague o valor para encerrar a promoção.</small></p><div class="tw"><table><tr><th></th><th>Peça</th><th>Preço</th><th>Promocional (R$)</th><th>Promoção</th><th>Novidade</th><th>Destaque</th><th></th></tr>${P.map(p=>`<tr><td><img src="${esc(p.img)}" alt=""></td><td>${esc(p.name)}<small style="display:block">${esc(p.code)}</small></td><td>${p.price?money(p.price):"—"}</td><td><input id="pp_${p.id}" type="number" step="0.01" value="${esc(p.promo)}" style="width:100px"></td><td><input type="checkbox" id="ps_${p.id}" ${p.sale?"checked":""} aria-label="Promoção"></td><td><input type="checkbox" id="pl_${p.id}" ${p.launch?"checked":""} aria-label="Novidade"></td><td><input type="checkbox" id="pd_${p.id}" ${p.featured?"checked":""} aria-label="Destaque"></td><td><button class="btn s" data-a="savePromo" data-v="${p.id}">Salvar</button></td></tr>`).join("")}</table></div><h3 style="margin-top:24px">Cupons de desconto</h3>`}
function catTab(){return `<h3>Categorias da loja</h3><div class="row" style="margin-bottom:14px"><input id="nc" placeholder="Nova categoria" style="max-width:260px"><button class="btn s" data-a="addCat">Adicionar</button></div>${S.cats.map((c,i)=>`<div class="bar" style="margin-bottom:8px"><span class="row"><input id="rc_${i}" value="${esc(c)}" style="width:200px"><small>${P.filter(p=>p.cat===c).length} peça(s)</small></span><span class="row"><button class="btn s o" data-a="moveCat" data-v="${i},-1" aria-label="Subir">↑</button><button class="btn s o" data-a="moveCat" data-v="${i},1" aria-label="Descer">↓</button><button class="btn s o" data-a="renCat" data-v="${i}">Renomear</button><button class="btn s o" data-a="delCat" data-v="${i}">Excluir</button></span></div>`).join("")}<p><small>As categorias Novidades e Promoções são automáticas, conforme as marcações das peças.</small></p>`}
function renderAdmin(){
 const A=$("#adm");
 if(!session){A.innerHTML=`<div class="box" style="margin-top:40px;max-width:360px;text-align:center"><h2>${esc(NAME())}</h2><p>Área administrativa</p><label>E-mail<input type="email" id="lu" autocomplete="username"></label><label>Senha<input id="lp" type="password" autocomplete="current-password"></label><div class="err" id="le"></div><p><button class="btn" data-a="login">Entrar</button> <button class="btn o" data-a="home">Voltar</button></p></div>`;return}
 const tabs=["Painel","Produtos","Pedidos","Promoções","Categorias","Loja"].filter(t=>!LOCAL||t!=="Pedidos"),es=P.filter(out).length,low=P.filter(p=>!out(p)&&ctrl(p)&&total(p)<=2);
 const pend=ORD.filter(o=>o.status==="Aguardando confirmação").length;
 let h=`<div class="bar"><b>Painel administrativo · ${esc(NAME())}</b><div class="row">${LOCAL?'<button class="btn s" data-a="download">Baixar site atualizado</button>':""}<button class="btn o s" data-a="home">Ver loja</button><button class="btn o s" data-a="logout">Sair</button></div></div>${LOCAL?`<p style="font-size:14px;color:var(--rose)">${dirty?"Há alterações não publicadas. ":""}As alterações ficam salvas neste aparelho. Para as clientes verem, clique em <b>Baixar site atualizado</b> e envie o arquivo <b>index.html</b> ao GitHub, substituindo o atual.</p>`:""}<div class="err" id="pm"></div><div class="tabs">${tabs.map(t=>`<button data-a="tab" data-v="${t}" aria-pressed="${t===tab}">${t}${t==="Pedidos"&&pend?" ("+pend+")":""}</button>`).join("")}</div>`;
 if(tab==="Painel")h+=`<div class="kp"><div><b>${P.length}</b>Modelos</div><div><b>${P.reduce((a,p)=>a+total(p),0)}</b>Peças em estoque controlado</div><div><b>${P.length-es}</b>Disponíveis</div><div><b>${es}</b>Esgotados</div><div><b>${low.length}</b>Estoque baixo</div><div><b>${pend}</b>Pedidos aguardando</div><div><b>${ORD.filter(o=>o.stock_deducted).length}</b>Vendas confirmadas</div></div>${low.length?`<p><b>Estoque baixo:</b> ${low.map(p=>esc(p.name)+" ("+total(p)+")").join(", ")}</p>`:""}<p><button class="btn" data-a="edit" data-v="">Cadastrar nova peça</button> ${P.length?"":'<button class="btn o" data-a="seed">Importar peças iniciais</button>'}</p>`;
 if(tab==="Produtos")h+=`<p><button class="btn" data-a="edit" data-v="">Cadastrar nova peça</button> ${P.length?"":'<button class="btn o" data-a="seed">Importar peças iniciais</button>'}</p><div class="tw"><table><tr><th></th><th>Código</th><th>Nome</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th>Situação</th><th>Ações</th></tr>${P.map(p=>`<tr><td><img src="${esc(p.img)}" alt=""></td><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.cat)}</td><td>${pr(p)?money(pr(p)):"—"}</td><td>${vars(p).length?esc(fmt(p.sizes)):(st(p)==null?"sem controle":st(p))}</td><td>${p.hidden?"Oculta":out(p)?"Esgotada":"Publicada"}</td><td class="row"><button class="btn s o" data-a="edit" data-v="${p.id}">Editar</button><button class="btn s o" data-a="dup" data-v="${p.id}">Duplicar</button><button class="btn s o" data-a="hide" data-v="${p.id}">${p.hidden?"Publicar":"Ocultar"}</button><button class="btn s o" data-a="del" data-v="${p.id}">Excluir</button></td></tr>`).join("")}</table></div>`;
 if(tab==="Pedidos")h+=ORD.length?`<div class="tw"><table><tr><th>Pedido</th><th>Cliente</th><th>Peças</th><th>Total</th><th>Status</th></tr>${ORD.map(o=>`<tr><td>${esc(o.number)}<small style="display:block">${new Date(o.created_at).toLocaleString("pt-BR")}</small></td><td>${esc(o.customer)}<small style="display:block"><a href="https://wa.me/55${esc(String(o.phone).replace(/\D/g,"").replace(/^55/,""))}" target="_blank" rel="noopener">${esc(o.phone)}</a> · ${esc(o.mode)}${o.address?" · "+esc(o.address):""}</small><small style="display:block">${esc(o.payment)}${o.notes?" · "+esc(o.notes):""}</small></td><td>${(o.items||[]).map(i=>`${i.qty}x ${esc(i.name)}${i.size?" ("+esc(i.size)+")":""}`).join("<br>")}</td><td>${money(o.total)}</td><td><select data-o="${o.id}">${STAT.map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select><small style="display:block">${o.stock_deducted?"Estoque baixado":"Estoque não baixado"}</small></td></tr>`).join("")}</table></div><p><small>O estoque baixa uma única vez ao mudar para Confirmado (ou etapas seguintes) e volta se o pedido for Cancelado.</small></p>`:"<p>Nenhum pedido registrado ainda.</p>";
 if(tab==="Promoções")h+=`${promoTable()}<div class="two"><div><h3>Novo cupom (valor fixo em reais)</h3><label>Código<input id="c_code"></label><label>Desconto (R$)<input id="c_value" type="number" step="0.01"></label><label>Compra mínima (R$)<input id="c_min" type="number" step="0.01"></label><label>Válido até<input id="c_end" type="date"></label><p><button class="btn" data-a="addC">Adicionar cupom</button></p></div><div><h3>Cupons</h3>${CUP.map(c=>`<div class="bar" style="margin-bottom:8px"><span><b>${esc(c.code)}</b> · ${money(c.value)}${+c.min?" · mín. "+money(c.min):""}${c.ends?" · até "+esc(c.ends):""}</span><span class="row"><button class="btn s o" data-a="togC" data-v="${c.id}">${c.active?"Desativar":"Ativar"}</button><button class="btn s o" data-a="delC" data-v="${c.id}">Remover</button></span></div>`).join("")||"<p>Nenhum cupom cadastrado.</p>"}</div></div>`;
 if(tab==="Categorias")h+=catTab();
 if(tab==="Loja"){const i=(k,l)=>`<label>${l}<input id="l_${k}" value="${esc(S[k])}"></label>`,t=(k,l)=>`<label>${l}<textarea id="l_${k}" rows="2">${esc(S[k])}</textarea></label>`;
  h+=`<div class="two"><div>${i("name","Nome da loja")}<label>Foto do banner (retangular, ideal 1600×600)<input id="l_ban" type="file" accept="image/*"></label><div id="bprev" style="margin:6px 0">${S.banner?`<img src="${esc(S.banner)}" alt="" style="width:100%;max-height:120px;object-fit:cover;border-radius:8px">`:"<small>Sem foto no banner.</small>"}</div><p><button class="btn s o" data-a="rmBan">Remover foto do banner</button></p>${i("whats","WhatsApp (com 55 e DDD)")}${i("insta","Link do Instagram (https://…)")}${i("slogan","Slogan")}${i("bt","Título do banner")}${t("btx","Texto do banner")}<label>Categorias (separadas por vírgula)<input id="l_cats" value="${esc(S.cats.join(", "))}"></label>${i("fee","Taxa de entrega em R$ (vazio = a combinar)")}</div><div>${t("about","Sobre a marca")}${t("care","Cuidados com as semijoias")}${t("garantia","Garantia")}${t("troca","Trocas e devoluções")}${t("entrega","Entregas")}<p><button class="btn" data-a="saveL">Salvar configurações</button></p></div></div>`}
 A.innerHTML=h;
 if($("#l_ban"))$("#l_ban").onchange=e=>{const f=e.target.files[0];if(f)shrink(f,1600,d=>{bimg=d;$("#bprev").innerHTML=`<img src="${d}" alt="" style="width:100%;max-height:120px;object-fit:cover;border-radius:8px"><small>Clique em Salvar configurações para aplicar.</small>`})};
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const f=act[t.dataset.a];if(f){if(t.tagName==="A")e.preventDefault();f(t.dataset.v,t,e)}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.o)act.status(t.dataset.o,t.value);if(t.id==="cm")sumView();if(t.id==="pfsel"){pf=t.value;render()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="lp")act.login();if(e.key==="Escape"){act.close();act.unzoom();$("#bag").classList.remove("on")}});
$("#q").oninput=e=>{q=e.target.value.toLowerCase().trim();adminView=false;render()};
(async()=>{render();if(sb){try{const r=await sb.auth.getSession();session=r.data.session}catch(e){}}await load();await adminLoad();render()})();
</script>
